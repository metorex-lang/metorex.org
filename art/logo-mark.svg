<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Metorex</title>
  <defs>
    <linearGradient id="ruby-deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a30f33"/>
      <stop offset="1" stop-color="#4a0619"/>
    </linearGradient>
    <linearGradient id="ruby-mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d1123f"/>
      <stop offset="1" stop-color="#8e0d2e"/>
    </linearGradient>
    <linearGradient id="ruby-bright" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0436a"/>
      <stop offset="1" stop-color="#c8123e"/>
    </linearGradient>
    <linearGradient id="ruby-hot" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcad6"/>
      <stop offset="0.5" stop-color="#f0436a"/>
      <stop offset="1" stop-color="#d1123f"/>
    </linearGradient>
    <linearGradient id="ruby-darkest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d0a24"/>
      <stop offset="1" stop-color="#2a0410"/>
    </linearGradient>
    <linearGradient id="trail-outer" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#0891b2" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0891b2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail-core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ecfeff" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="heat" cx="0.5" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <path id="glint" d="M0,-46 L7,-7 L46,0 L7,7 L0,46 L-7,7 L-46,0 L-7,-7 Z"/>
  </defs>

  <!-- Gem drawn upright with its culet at the bottom, then turned so it falls
       toward the lower left with the trail behind it. -->
  <g transform="translate(512 512) rotate(38) scale(0.66) translate(0 400)">

    <g id="trail">
      <path d="M-330,-90 C-260,-480 -80,-880 0,-1150 C80,-880 260,-480 330,-90 Z" fill="url(#trail-outer)" filter="url(#glow)"/>
      <path d="M-250,-110 C-200,-460 -70,-820 0,-1080 C70,-820 200,-460 250,-110 Z" fill="url(#trail-outer)"/>
      <path d="M-120,-140 C-95,-420 -30,-700 0,-900 C30,-700 95,-420 120,-140 Z" fill="url(#trail-core)" filter="url(#soft)"/>
      <path d="M-275,-150 C-250,-380 -215,-560 -190,-700" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.55"/>
      <path d="M275,-150 C250,-380 215,-560 190,-700" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.55"/>
      <g fill="#67e8f9">
        <circle cx="-215" cy="-520" r="12" opacity="0.8"/>
        <circle cx="235" cy="-610" r="9" opacity="0.7"/>
        <circle cx="-110" cy="-840" r="8" opacity="0.6"/>
        <circle cx="140" cy="-930" r="6" opacity="0.5"/>
        <circle cx="-300" cy="-330" r="10" opacity="0.75"/>
        <circle cx="320" cy="-420" r="7" opacity="0.6"/>
        <circle cx="-40" cy="-1000" r="5" opacity="0.4"/>
        <circle cx="60" cy="-760" r="6" opacity="0.55"/>
      </g>
    </g>

    <g id="gem" stroke="#e2e8f0" stroke-opacity="0.3" stroke-width="2.5" stroke-linejoin="round">
      <!-- Crown: table edge at y=-200, girdle at y=-80. The trail lights it from above. -->
      <polygon points="-340,-80 -180,-200 -250,-80" fill="url(#ruby-mid)"/>
      <polygon points="-180,-200 -120,-80 -250,-80" fill="url(#ruby-bright)"/>
      <polygon points="-180,-200 -60,-200 -120,-80" fill="url(#ruby-bright)"/>
      <polygon points="-60,-200 0,-80 -120,-80" fill="url(#ruby-hot)"/>
      <polygon points="-60,-200 60,-200 0,-80" fill="url(#ruby-hot)"/>
      <polygon points="60,-200 120,-80 0,-80" fill="url(#ruby-bright)"/>
      <polygon points="60,-200 180,-200 120,-80" fill="url(#ruby-hot)"/>
      <polygon points="180,-200 250,-80 120,-80" fill="url(#ruby-mid)"/>
      <polygon points="180,-200 340,-80 250,-80" fill="url(#ruby-deep)"/>

      <!-- Girdle band -->
      <polygon points="-340,-80 -120,-80 -120,-66 -340,-66" fill="url(#ruby-mid)"/>
      <polygon points="-120,-80 120,-80 120,-66 -120,-66" fill="url(#ruby-deep)"/>
      <polygon points="120,-80 340,-80 340,-66 120,-66" fill="url(#ruby-darkest)"/>

      <!-- Pavilion: lower girdle facets down to y=130, mains down to the culet at y=330 -->
      <polygon points="-340,-66 -250,-66 -175,130" fill="url(#ruby-mid)"/>
      <polygon points="-250,-66 -120,-66 -175,130" fill="url(#ruby-deep)"/>
      <polygon points="-120,-66 -60,130 -175,130" fill="url(#ruby-mid)"/>
      <polygon points="-120,-66 0,-66 -60,130" fill="url(#ruby-darkest)"/>
      <polygon points="0,-66 60,130 -60,130" fill="url(#ruby-bright)"/>
      <polygon points="0,-66 120,-66 60,130" fill="url(#ruby-deep)"/>
      <polygon points="120,-66 175,130 60,130" fill="url(#ruby-darkest)"/>
      <polygon points="120,-66 250,-66 175,130" fill="url(#ruby-deep)"/>
      <polygon points="250,-66 340,-66 175,130" fill="url(#ruby-darkest)"/>
      <polygon points="-340,-66 -175,130 0,330" fill="url(#ruby-deep)"/>
      <polygon points="-175,130 -60,130 0,330" fill="url(#ruby-mid)"/>
      <polygon points="-60,130 60,130 0,330" fill="url(#ruby-deep)"/>
      <polygon points="60,130 175,130 0,330" fill="url(#ruby-darkest)"/>
      <polygon points="175,130 340,-66 0,330" fill="url(#ruby-darkest)"/>
    </g>

    <polyline points="-340,-80 -180,-200 180,-200 340,-80" fill="none" stroke="#e2e8f0" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
    <polygon points="-180,-200 180,-200 168,-188 -168,-188" fill="#e2e8f0" opacity="0.75"/>

    <g fill="#ffffff">
      <use href="#glint" transform="translate(170 -200) scale(1.1)"/>
      <use href="#glint" transform="translate(-60 -110) scale(0.55)" opacity="0.85"/>
      <use href="#glint" transform="translate(10 60) scale(0.45)" opacity="0.7"/>
    </g>
  </g>
</svg>
