<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Metorex</title>
  <defs>
    <linearGradient id="crown" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd2a8"/>
      <stop offset="1" stop-color="#ff8a3d"/>
