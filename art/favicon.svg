    <polygon points="180,-200 340,-80 110,-80" fill="#e8433a"/>
    <polygon points="-340,-80 -110,-80 0,330" fill="#e8433a"/>
    <polygon points="-110,-80 110,-80 0,330" fill="#a3221c"/>
